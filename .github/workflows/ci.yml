name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools
      - run: npm run check --prefix tools
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform ios --output-dir /tmp/phi-remote-ios
